<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>松下新风产品中心</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="返回首页">
        <img src="assets/images/Panasonic_logo.jpg" alt="Panasonic" class="brand-logo" />
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="products.html">产品</a>
        <a href="compare.html">对比</a>
        <a href="selector.html">选型</a>
        <a href="six.html">6恒系统</a>
      </nav>
    </header>

    <main>
      <section class="hero section-band">
        <div class="hero-layout">
          <div class="hero-copy">
            <p class="eyebrow">住宅空气解决方案</p>
            <h1>松下新风</h1>
            <p class="hero-desc">
              尽享科技魅力赋予的品质生活
            </p>
            <div class="hero-actions">
              <a class="button primary" href="products.html">查看产品</a>
              <a class="button secondary" href="selector.html">开始选型</a>
            </div>
          </div>
          <div class="hero-visual">
            <div class="banner-carousel">
              <div class="banner-track">
                <img src="sources/BANNER_ZXC2C.png" alt="Banner 1" class="banner-slide active" />
                <img src="sources/BANNER_ZM2C.png" alt="Banner 2" class="banner-slide" />
                <img src="sources/BANNER_50NC.png" alt="Banner 3" class="banner-slide" />
                <img src="sources/BANNER_ZDP2C.png" alt="Banner 4" class="banner-slide" />
              </div>
              <button class="banner-arrow banner-prev" aria-label="上一张">&#10094;</button>
              <button class="banner-arrow banner-next" aria-label="下一张">&#10095;</button>
              <div class="banner-dots">
                <span class="banner-dot active" data-index="0"></span>
                <span class="banner-dot" data-index="1"></span>
                <span class="banner-dot" data-index="2"></span>
                <span class="banner-dot" data-index="3"></span>
              </div>
            </div>
          </div>
        </div>
      </section>



      <section class="section section-muted">
        <div class="section-heading">  
          <h2>主力产品预览</h2>
          <p>全热新风与除湿产品系列，完整产品列表进入产品页查看。</p>
        </div>
        <div id="productGrid" class="product-grid" data-limit="6"></div>
      </section>
    </main>

    <div id="productModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="icon-button" type="button" data-close aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </article>
    </div>

    <footer class="footer">
      <span>Panasonic 新风产品中心草稿</span>
      <span>适配静态部署：GitHub Pages / Oracle 服务器 / 国内云服务器</span>
    </footer>

    <script src="assets/app.js"></script>
  </body>
</html>
